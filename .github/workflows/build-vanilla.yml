name: Build Vanilla Kernel (Exynos 2100 - o1s)

on:
  push:
    branches: [main, master, floppy-main]
    tags: ['v*']
  pull_request:
    branches: [main, master, floppy-main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag/SHA to build'
        required: false
        default: ''

env:
  KERNEL_VERSION: '5.4'
  ARCH: arm64
  DEVICE: o1s

jobs:
  build:
    name: Build vanilla kernel for o1s
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Build kernel (all-in-one)
        shell: bash
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin:${{ env.PATH }}
        run: |
          set -e
          echo "PATH=$PATH"
          which chmod
          which bash
          which git

          # Free up disk space (aggressive)
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/include/boost
          sudo apt-get clean
          sudo apt-get autoremove -y
          df -h /
          
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            pahole \
            cpio \
            git \
            wget \
            python3 \
            python3-pyelftools \
            libncurses-dev \
            zlib1g-dev \
            libtinfo-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu
          which aarch64-linux-gnu-gcc

          # Install LLVM/Clang
          for i in 1 2 3; do
            wget -q --timeout=30 --tries=3 https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang%2Bllvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz -O clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz && [ -f clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz ] && break
            sleep 10
          done
          tar -xf clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          rm clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          CLANG_PATH="$PWD/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04/bin"
          export PATH="$CLANG_PATH:$PATH"
          clang --version
          ld.lld --version

          # Build kernel
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          chmod +x build_kernel_vanilla.sh
          ./build_kernel_vanilla.sh

      - name: Verify build artifacts
        shell: bash
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          ls -la artifacts/Image.gz
          ls -la artifacts/*.dtbo

      - name: Package o1s artifacts
        shell: bash
        run: |
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH"
          tar -czf vanilla-kernel-o1s-${{ github.sha }}.tar.gz -C artifacts .

      - name: Upload o1s artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-kernel-o1s
          path: vanilla-kernel-o1s-*.tar.gz
          retention-days: 30

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: vanilla-kernel-o1s-*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}