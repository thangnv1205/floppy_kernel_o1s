name: Build Vanilla Kernel (Exynos 2100 - o1s)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag/SHA to build'
        required: false
        default: ''

env:
  KERNEL_VERSION: '5.4'
  ARCH: arm64
  DEVICE: o1s

jobs:
  build:
    name: Build vanilla kernel for o1s
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up toolchain
        run: |
          # Free up disk space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo apt-get clean
          df -h /
          
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            dwarves \
            pahole \
            cpio \
            git \
            wget \
            python3 \
            python3-pyelftools \
            libncurses-dev \
            zlib1g-dev \
            libtinfo-dev

      - name: Install LLVM/Clang
        run: |
          for i in 1 2 3; do
            wget -q --timeout=30 --tries=3 https://github.com/llvm/llvm-project/releases/download/llvmorg-15.0.7/clang+llvm-15.0.7-x86_64-linux-gnu-ubuntu-22.04.tar.xz && [ -f clang+llvm-15.0.7-x86_64-linux-gnu-ubuntu-22.04.tar.xz ] && break
            sleep 10
          done
          tar -xf clang+llvm-15.0.7-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          rm clang+llvm-15.0.7-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          echo "$PWD/clang+llvm-15.0.7-x86_64-linux-gnu-ubuntu-22.04/bin" >> $GITHUB_PATH
          export PATH="$PWD/clang+llvm-15.0.7-x86_64-linux-gnu-ubuntu-22.04/bin:$PATH"
          clang --version
          ld.lld --version

      - name: Build vanilla kernel (o1s)
        env:
          PATH: ${{ env.PATH }}:${{ github.workspace }}/clang+llvm-15.0.7-x86_64-linux-gnu-ubuntu-22.04/bin
        run: |
          chmod +x build_kernel_vanilla.sh
          ./build_kernel_vanilla.sh

      - name: Verify build artifacts
        run: |
          ls -la artifacts/Image.gz
          ls -la artifacts/*.dtbo

      - name: Package o1s artifacts
        run: |
          tar -czf vanilla-kernel-o1s-${{ github.sha::8 }}.tar.gz -C artifacts .

      - name: Upload o1s artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-kernel-o1s
          path: vanilla-kernel-o1s-*.tar.gz
          retention-days: 30

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: vanilla-kernel-o1s-*.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}