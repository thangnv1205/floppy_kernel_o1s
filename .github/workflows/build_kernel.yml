name: Build Kernel

on:
  push:
    branches: [main, floppy-main]
  pull_request:
    branches: [main, floppy-main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git gnupg gperf imagemagick libncurses-dev libtinfo-dev \
            libelf-dev liblz4-tool libsdl1.2-dev \
            libssl-dev libxml2-dev libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip python3-setuptools

      - name: Setup toolchain
        run: |
          mkdir -p ~/toolchains
          cd ~/toolchains
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/clang-r416183b
          echo "~/toolchains/aarch64-linux-android-4.9/bin" >> $GITHUB_PATH
          echo "~/toolchains/arm-linux-androideabi-4.9/bin" >> $GITHUB_PATH
          echo "~/toolchains/clang-r416183b/bin" >> $GITHUB_PATH

      - name: Build kernel (vanilla o1s)
        run: |
          chmod +x build_kernel_vanilla.sh
          ./build_kernel_vanilla.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: artifacts/
          retention-days: 7