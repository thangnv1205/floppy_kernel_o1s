# /data/adaptive-pin.conf — adaptive-pin daemon config
# Percentages index into scaling_available_frequencies of each cluster,
# so they adapt to whatever OPP table the ACPM firmware exposes.

# battery profile: schedutil keeps scaling inside a clamped range
BATTERY_CPU_MAX_PERCENT=65
BATTERY_GPU_MAX_PERCENT=55

# game profile: pin near the top OPP for full performance
GAME_CPU_MIN_PERCENT=100
GAME_GPU_MIN_PERCENT=70
# force devfreq governor=performance in game profile (1) or keep current (0)
GAME_GPU_PERFORMANCE_GOV=1

# detection: marker = watch GAME_MARKER_FILE (toggle by your Game Mode app),
# foreground = poll mCurrentFocus against GAME_PACKAGES
DETECT_MODE=marker
GAME_MARKER_FILE=/data/adaptive-pin.game
DETECT_INTERVAL_SEC=2

GAME_PACKAGES="com.epicgames.fortnite com.tencent.ig com.pubg.imobile com.activision.callofduty.shooter com.gameloft.android.ANMP.GloftA9HM com.tencent.tmgp.pubgmhd com.moonton.mlbb"

GPU_DEFAULT_GOVERNOR=simpleondemand
